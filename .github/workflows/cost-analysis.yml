name: Infrastructure Cost Analysis

# Cost analysis runs manually or when INFRACOST_API_KEY is configured.
# Trigger manually via: Actions → Infrastructure Cost Analysis → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infracost:
    name: Infracost Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        with:
          api_key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost JSON
        run: infracost breakdown --path terraform/environments/prod --format json --out-file /tmp/infracost.json

      - name: Post Infracost comment
        uses: infracost/actions/comment@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        with:
          path: /tmp/infracost.json
          behavior: update
