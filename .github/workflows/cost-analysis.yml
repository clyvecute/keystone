name: Infrastructure Cost Analysis

# Cost analysis runs manually or when INFRACOST_API_KEY is configured.
# Trigger manually via: Actions → Infrastructure Cost Analysis → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infracost:
    name: Infracost Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Infracost API Key
        id: check-key
        run: |
          if [ -z "${{ secrets.INFRACOST_API_KEY }}" ] || [ "${{ secrets.INFRACOST_API_KEY }}" = "disabled" ]; then
            echo "::warning::INFRACOST_API_KEY is not configured or disabled. Skipping cost analysis."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### Infracost Cost Analysis" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped: \`INFRACOST_API_KEY\` secret is not configured or is set to \`disabled\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Infracost
        if: steps.check-key.outputs.enabled == 'true'
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost breakdown
        if: steps.check-key.outputs.enabled == 'true'
        run: |
          infracost breakdown --path terraform/environments/prod --format table
          infracost breakdown --path terraform/environments/prod --format markdown >> "$GITHUB_STEP_SUMMARY"
