name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configra_ref:
        description: Configra branch, tag, or commit to build
        required: true
        type: string
        default: main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  IMAGE_NAME: configra

permissions:
  contents: read
  security-events: write

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Map secrets to env so they can be used in if: conditions
    # (secrets context is not available in if: expressions)
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout Configra source
        id: configra
        uses: actions/checkout@v5
        with:
          repository: clyvecute/configra
          ref: ${{ inputs.configra_ref || 'main' }}
          path: configra-src

      - name: Check Secrets
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID is required for Configra image publishing"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "WIF_PROVIDER is required for Configra image publishing"; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo "WIF_SERVICE_ACCOUNT is required for Configra image publishing"; exit 1; }

      - name: Authenticate to Google Cloud
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        if: env.WIF_PROVIDER != ''
        run: gcloud auth configure-docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.configra.outputs.commit }}
            type=raw,value=main

      - name: Build and push Docker image
        id: build
        if: env.WIF_PROVIDER != ''
        uses: docker/build-push-action@v5
        with:
          context: configra-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Configra source revision
        if: env.WIF_PROVIDER != ''
        run: printf '%s' '${{ steps.configra.outputs.commit }}' > configra-source-revision.txt

      - name: Upload Configra source revision
        if: env.WIF_PROVIDER != ''
        uses: actions/upload-artifact@v4
        with:
          name: configra-source-revision
          path: configra-source-revision.txt
          retention-days: 7

      - name: Generate SBOM
        if: env.WIF_PROVIDER != ''
        uses: anchore/sbom-action@v0
        with:
          image: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.configra.outputs.commit }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: env.WIF_PROVIDER != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Scan image for vulnerabilities
        if: env.WIF_PROVIDER != ''
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ steps.configra.outputs.commit }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: env.WIF_PROVIDER != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
