name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  IMAGE_NAME: configra

permissions:
  contents: read
  security-events: write

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then echo "::warning::GCP_PROJECT_ID not set — GCP steps will be skipped."; fi
          if [ -z "${{ secrets.WIF_PROVIDER }}" ]; then echo "::warning::WIF_PROVIDER not set — GCP auth steps will be skipped."; fi
          if [ -z "${{ secrets.WIF_SERVICE_ACCOUNT }}" ]; then echo "::warning::WIF_SERVICE_ACCOUNT not set — GCP auth steps will be skipped."; fi

      - name: Authenticate to Google Cloud
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for GCR
        if: ${{ secrets.WIF_PROVIDER != '' }}
        run: gcloud auth configure-docker

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gcr.io/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Scan image for vulnerabilities
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: '${{ github.workspace }}/trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: github/codeql-action/upload-sarif@v4.35.1
        with:
          sarif_file: '${{ github.workspace }}/trivy-results.sarif'
