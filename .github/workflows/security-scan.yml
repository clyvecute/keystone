name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── IaC SCANNING (tfsec + Checkov) ───────────────────────────
  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── tfsec ──
      - name: Install tfsec
        run: |
          curl -sL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec

      - name: Run tfsec
        run: |
          tfsec terraform/ --format sarif --out tfsec-results.sarif --soft-fail || true
          if [ ! -f tfsec-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"tfsec","rules":[]}},"results":[]}]}' > tfsec-results.sarif
          fi

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      # ── Checkov ──
      - name: Install Checkov
        run: pip install --quiet checkov

      - name: Run Checkov
        run: |
          checkov -d terraform --framework terraform \
            --output sarif \
            --output-file-path . \
            --skip-check CKV_GCP_82 \
            --soft-fail || true
          if [ ! -f results_sarif.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"checkov","rules":[]}},"results":[]}]}' > results_sarif.sarif
          fi

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov

  # ─── FILESYSTEM SCANNING (Trivy) ─────────────────────────────
  container-security:
    name: Container & Filesystem Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy


  # ─── SECRETS DETECTION (TruffleHog) ───────────────────────────
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          extra_args: --only-verified --results=verified

  # ─── SUPPLY CHAIN & SCORECARD ─────────────────────────────────
  supply-chain-security:
    name: Supply Chain Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22.7'

      - name: Install Scorecard
        run: |
          go install github.com/ossf/scorecard/v5@v5.0.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run OSSF Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard \
            --repo="github.com/${GITHUB_REPOSITORY}" \
            --format=sarif \
            --output=scorecard.sarif || true

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        if: always() && hashFiles('scorecard.sarif') != ''
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # ─── REPORT ───────────────────────────────────────────────────
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [terraform-security, container-security, secrets-scan, supply-chain-security]
    if: always()

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Create security summary
        run: |
          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "⚠️" ;;
            esac
          }

          TF=$(status_icon "${{ needs.terraform-security.result }}")
          CT=$(status_icon "${{ needs.container-security.result }}")
          SE=$(status_icon "${{ needs.secrets-scan.result }}")
          SC=$(status_icon "${{ needs.supply-chain-security.result }}")

          cat >> $GITHUB_STEP_SUMMARY << 'REPORT'
          # 🔒 Security Scan Report

          | Scan | Tools | Status |
          |------|-------|--------|
          REPORT

          echo "| Terraform IaC | tfsec + Checkov | $TF ${{ needs.terraform-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Filesystem | Trivy | $CT ${{ needs.container-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | TruffleHog | $SE ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain | OSSF Scorecard | $SC ${{ needs.supply-chain-security.result }} |" >> $GITHUB_STEP_SUMMARY

          cat >> $GITHUB_STEP_SUMMARY << 'REPORT'

          ---
          > View detailed findings in the [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)
          REPORT

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const output = `#### 🔒 Security Scan Results

            | Scan | Status |
            |------|--------|
            | Terraform IaC | ${{ needs.terraform-security.result }} |
            | Filesystem | ${{ needs.container-security.result }} |
            | Secrets | ${{ needs.secrets-scan.result }} |
            | Supply Chain | ${{ needs.supply-chain-security.result }} |

            *View detailed results in the Security tab*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
