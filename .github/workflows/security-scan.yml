name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write # Required for Scorecard results publication
  actions: read   # Required for Scorecard to read active workflows

jobs:
  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install tfsec
        run: |
          curl -sL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec
          chmod +x /usr/local/bin/tfsec

      - name: Run tfsec
        run: |
          tfsec terraform/ --format sarif --out tfsec-results.sarif || true
          # Create a minimal valid SARIF file if tfsec didn't produce one
          if [ ! -f tfsec-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"tfsec","rules":[]}},"results":[]}]}' > tfsec-results.sarif
          fi

      - name: Upload tfsec results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov -d terraform --framework terraform \
            --output sarif \
            --output-file-path . \
            --skip-check CKV_GCP_82 \
            --soft-fail || true
          # Checkov writes results_sarif.sarif in the output-file-path directory
          # Create a minimal valid SARIF file if Checkov didn't produce one
          if [ ! -f results_sarif.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"checkov","rules":[]}},"results":[]}]}' > results_sarif.sarif
          fi

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov

  container-security:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/iac@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          file: terraform
          args: --severity-threshold=medium

      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.3.1
        continue-on-error: true
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.82.0
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [terraform-security, container-security, dependency-security, secrets-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create security summary
        run: |
          # Status emoji helper
          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              *)        echo "⚠️" ;;
            esac
          }

          TF=$(status_icon "${{ needs.terraform-security.result }}")
          CT=$(status_icon "${{ needs.container-security.result }}")
          DP=$(status_icon "${{ needs.dependency-security.result }}")
          SC=$(status_icon "${{ needs.secrets-scan.result }}")

          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🔒 Security Scan Report

          **Repository:** \`${{ github.repository }}\`
          **Branch:** \`${{ github.ref_name }}\`
          **Triggered by:** \`${{ github.event_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          ## Scan Results

          | Scan | Tool | Status | Details |
          |------|------|--------|---------|
          | Terraform IaC | tfsec + Checkov | $TF ${{ needs.terraform-security.result }} | Checks HCL for misconfigs & CVEs |
          | Container Image | Trivy | $CT ${{ needs.container-security.result }} | Scans filesystem for vulnerabilities |
          | Dependencies | Snyk + Scorecard | $DP ${{ needs.dependency-security.result }} | Audits packages & supply chain |
          | Secrets Detection | Gitleaks + TruffleHog | $SC ${{ needs.secrets-scan.result }} | Scans git history for leaked secrets |

          ---

          ## 📊 Where to Find Detailed Results

          - **Code Scanning Alerts** → [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)
          - **tfsec findings** → uploaded as SARIF to GitHub Security
          - **Checkov findings** → uploaded as SARIF to GitHub Security
          - **Trivy findings** → uploaded as SARIF to GitHub Security

          ---
          > _Scans run on every push to \`main\`/\`develop\` and daily at 02:00 UTC_
          EOF

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Security Scan Results 🔒
            
            | Scan Type | Status |
            |-----------|--------|
            | Terraform Security | ${{ needs.terraform-security.result }} |
            | Container Security | ${{ needs.container-security.result }} |
            | Dependency Security | ${{ needs.dependency-security.result }} |
            | Secrets Detection | ${{ needs.secrets-scan.result }} |
            
            *View detailed results in the Security tab*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
